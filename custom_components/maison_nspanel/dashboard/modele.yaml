          - type: custom:button-card
            show_icon: false
            show_name: false
            show_label: false
            triggers_update:
              - sensor.previsions_meteo_7_jours
              - sensor.maison_nspanel_previsions
              - sensor.maison_nspanel_vigilance
            tap_action:
              action: none
            custom_fields:
              rows: >
                [[[
                  const s = states['sensor.maison_nspanel_previsions'] || states['sensor.previsions_meteo_7_jours'];
                  const f = (s && s.attributes && Array.isArray(s.attributes.forecast)) ? s.attributes.forecast.slice(0, 7) : [];
                  if (f.length === 0) {
                    return '<div style="text-align:center;color:#8A96A8;padding:8vh 12px;font-size:13px;line-height:1.6">Prévisions indisponibles.<br>Vérifiez le capteur sensor.previsions_meteo_7_jours<br>(voir previsions_meteo_sensor.yaml).</div>';
                  }
                  // Vigilance Météo-France (capteur « <département> Weather alert », détecté seul)
                  const vigS = (variables.vigilance && states[variables.vigilance]) || Object.keys(states).filter(k => /^sensor\.(\d{2}|2a|2b)_weather_alert$/.test(k)).map(k => states[k])[0];
                  const vigLv = { vert: 1, jaune: 2, orange: 3, rouge: 4 };
                  const vigRgb = { 1: '74,222,128', 2: '250,204,21', 3: '251,146,60', 4: '239,68,68' };
                  // Si l'intégration est installée, son capteur de vigilance (réglé dans Configurer > Vigilance) prime
                  const vi = states['sensor.maison_nspanel_vigilance'];
                  const viOk = !!(vi && vi.attributes && vi.attributes.niveau !== undefined);
                  let vigHtml = '';
                  if (vigS || viOk) {
                    const lv = viOk ? vi.attributes.niveau : (vigLv[String(vigS.state || '').toLowerCase()] || 1);
                    const mini = (variables.vigilance_min !== undefined) ? variables.vigilance_min : 2;
                    if (viOk ? vi.attributes.afficher : lv >= mini) {
                      const c = viOk ? vi.attributes.couleur : vigRgb[lv];
                      const nom = ['', 'vert', 'jaune', 'orange', 'rouge'][lv].toUpperCase();
                      const ph = viOk ? (vi.attributes.phenomenes || []).map(x => x.nom).join(' · ') : Object.keys(vigS.attributes || {}).filter(k => vigLv[String(vigS.attributes[k]).toLowerCase()] >= 2)
                        .sort((a, b) => vigLv[String(vigS.attributes[b]).toLowerCase()] - vigLv[String(vigS.attributes[a]).toLowerCase()])
                        .map(k => k.replace(/-/g, ' / ')).join(' · ');
                      vigHtml = '<div style="margin-bottom:1vh;text-align:center"><div style="display:inline-flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;border-radius:18px;background:linear-gradient(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '100deg' : '145deg') + ', rgba(' + c + ',' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.00' : '.16') + ') 0%, rgba(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '5,12,22' : '16,23,40') + ',.82) 60%);border:1px solid rgba(' + c + ',.60);max-width:92%;box-sizing:border-box;text-align:left">'
                        + '<span style="display:flex;flex:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:12px;background:rgba(' + c + ',.20);border:1px solid rgba(' + c + ',.45);box-shadow:0 0 14px rgba(' + c + ',.40)">'
                        + '<ha-icon icon="mdi:weather-cloudy-alert" style="--mdc-icon-size:20px;color:rgb(' + c + ')"></ha-icon></span>'
                        + '<span style="display:flex;flex-direction:column;min-width:0"><span style="font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgb(' + c + ')">Vigilance ' + nom + '</span>'
                        + (ph ? '<span style="font-size:11px;font-weight:600;color:#E2E8F0;margin-top:1px">' + ph + '</span>' : '') + '</span></div></div>';
                    }
                  }
                  const tz = hass.config.time_zone;
                  const lows = f.map(d => Number(d.templow !== undefined && d.templow !== null ? d.templow : d.temperature));
                  const highs = f.map(d => Number(d.temperature));
                  const lo = Math.min.apply(null, lows), hi = Math.max.apply(null, highs), span = Math.max(hi - lo, 1);
                  const col = t => t < 5 ? '#60A5FA' : t < 12 ? '#38BDF8' : t < 18 ? '#4ADE80' : t < 24 ? '#FACC15' : '#FB923C';
                  const icons = { 'clear-night': 'mdi:weather-night', cloudy: 'mdi:weather-cloudy', exceptional: 'mdi:alert-circle-outline', fog: 'mdi:weather-fog', hail: 'mdi:weather-hail', lightning: 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy', partlycloudy: 'mdi:weather-partly-cloudy', pouring: 'mdi:weather-pouring', rainy: 'mdi:weather-rainy', snowy: 'mdi:weather-snowy', 'snowy-rainy': 'mdi:weather-snowy-rainy', sunny: 'mdi:weather-sunny', windy: 'mdi:weather-windy', 'windy-variant': 'mdi:weather-windy-variant' };
                  const colors = { sunny: '#FBBF24', 'clear-night': '#E2E8F0', partlycloudy: '#FCD34D', cloudy: '#CBD5E1', fog: '#CBD5E1', windy: '#CBD5E1', 'windy-variant': '#CBD5E1', rainy: '#7DD3FC', pouring: '#60A5FA', snowy: '#E0F2FE', 'snowy-rainy': '#BAE6FD', hail: '#BAE6FD', lightning: '#FACC15', 'lightning-rainy': '#FACC15', exceptional: '#FB923C' };
                  const fmt = t => (Math.round(t * 10) / 10) + '°C';
                  const todayKey = new Date().toLocaleDateString('fr-FR', { timeZone: tz });
                  return vigHtml + f.map((d, i) => {
                    const dt = new Date(d.datetime);
                    const isToday = dt.toLocaleDateString('fr-FR', { timeZone: tz }) === todayKey;
                    let day = dt.toLocaleDateString('fr-FR', { weekday: 'long', timeZone: tz });
                    day = isToday ? "Aujourd'hui" : day.charAt(0).toUpperCase() + day.slice(1);
                    const l = lows[i], h = highs[i];
                    const left = ((l - lo) / span) * 100, width = Math.max(((h - l) / span) * 100, 6);
                    const bar = 'linear-gradient(90deg,' + col(l) + ',' + col(h) + ')';
                    return '<div style="display:grid;grid-template-columns:minmax(0,1.5fr) 30px 56px minmax(0,2fr) 56px;align-items:center;column-gap:8px;flex:1;' + (i > 0 ? 'border-top:1px solid rgba(255,255,255,.08);' : '') + '">'
                      + '<span style="font-size:15px;font-weight:700;color:#FFFFFF;white-space:nowrap">' + day + '</span>'
                      + '<ha-icon icon="' + (icons[d.condition] || 'mdi:weather-cloudy') + '" style="--mdc-icon-size:24px;color:' + (colors[d.condition] || '#E2E8F0') + '"></ha-icon>'
                      + '<span style="font-size:14px;font-weight:600;color:#7DD3FC;text-align:right">' + fmt(l) + '</span>'
                      + '<div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.12)"><div style="position:absolute;top:0;bottom:0;left:' + left + '%;width:' + width + '%;border-radius:3px;background:' + bar + '"></div></div>'
                      + '<span style="font-size:14px;font-weight:600;color:#FFFFFF">' + fmt(h) + '</span>'
                      + '</div>';
                  }).join('');
                ]]]
            styles:
              grid:
                - grid-template-areas: '"rows"'
                - grid-template-columns: 1fr
              card:
                - min-height: 70vh
                - padding: 1vh 16px
                - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '14px' : '18px' ]]]"
                - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(255,255,255,.08)') ]]]"
                - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'linear-gradient(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '100deg' : '145deg') + ', rgba(56,189,248,' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.00' : '.08') + ') 0%, rgba(5,12,22,.80) 60%)' : 'linear-gradient(145deg, rgba(56,189,248,.08) 0%, rgba(16,23,40,.80) 60%)' ]]]"
                - box-shadow: none
              custom_fields:
                rows:
                  - display: flex
                  - flex-direction: column
                  - justify-content: space-between
                  - width: 100%
                  - min-height: 66vh
                  - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
