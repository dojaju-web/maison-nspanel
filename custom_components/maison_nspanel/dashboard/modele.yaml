                  const rain = 'repeating-linear-gradient(105deg, rgba(147,197,253,.12) 0 2px, transparent 2px 16px)';
                  const heavy = 'repeating-linear-gradient(105deg, rgba(147,197,253,.22) 0 2px, transparent 2px 9px)';
                  const snow = 'radial-gradient(circle, rgba(255,255,255,.80) 0 1.5px, transparent 2.5px) 0 0 / 34px 34px, radial-gradient(circle, rgba(255,255,255,.50) 0 1px, transparent 2px) 17px 17px / 34px 34px';
                  const stars = 'radial-gradient(circle at 12% 18%, #fff 0 1px, transparent 2px), radial-gradient(circle at 30% 8%, #fff 0 1px, transparent 2px), radial-gradient(circle at 46% 26%, #fff 0 1px, transparent 2px), radial-gradient(circle at 64% 10%, #fff 0 1px, transparent 2px), radial-gradient(circle at 20% 38%, #fff 0 1px, transparent 2px), radial-gradient(circle at 92% 44%, #fff 0 1px, transparent 2px)';
                  const fog = 'linear-gradient(180deg, rgba(203,213,225,.24) 0%, rgba(203,213,225,.06) 35%, rgba(203,213,225,.22) 70%, rgba(203,213,225,.08) 100%)';
                  const flash = 'radial-gradient(circle at 68% 18%, rgba(250,204,21,.40) 0, transparent 38vh)';
                  const wind = 'repeating-linear-gradient(180deg, rgba(203,213,225,.10) 0 2px, transparent 2px 22px)';
                  const layers = {
                    sunny: [shade, disc, sky],
                    'clear-night': [shade, moon, stars, sky],
                    partlycloudy: [shade, clouds, disc, sky],
                    cloudy: [shade, clouds, clouds, grey],
