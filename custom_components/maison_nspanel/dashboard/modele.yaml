                  // Le jour/la nuit vient du soleil (sun.sun), pas du fournisseur météo qui peut être en retard
                  let c = w ? w.state : 'unknown';
                  if (sun && !night && c === 'clear-night') c = 'sunny';
                  if (night && c === 'sunny') c = 'clear-night';
                  const imgs = variables.images || {};
                  const key = (c === 'lightning-rainy') ? 'lightning' : (c === 'snowy-rainy' || c === 'hail') ? 'snowy' : (c === 'windy-variant') ? 'windy' : c;
                  const nk = (night && c !== 'clear-night') ? key + '-night' : key;
                  // Dossier des images : fourni par l'intégration si présente, sinon /local/meteo
                  const base = states['sensor.maison_nspanel_rappels'] ? '/maison_nspanel/meteo' : (variables.images_dossier || '/local/meteo');
                  const img = imgs[nk] || imgs[key] || (base + '/' + nk + '.jpg?v=3');
                  const photo = img ? 'linear-gradient(180deg, rgba(7,11,20,.25), rgba(7,11,20,.70)), url(' + img + ') center / cover no-repeat, ' : '';
                  const shade = 'linear-gradient(180deg, rgba(7,11,20,.05) 0%, rgba(7,11,20,.60) 100%)';
                  const sky = night ? 'linear-gradient(180deg, #0a1226 0%, #05080f 100%)' : 'linear-gradient(180deg, #17335c 0%, #0b1120 100%)';
                  const grey = 'linear-gradient(180deg, #1a2438 0%, #0b1120 100%)';
