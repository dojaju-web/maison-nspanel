# ============================================================
#  Dashboard Maison  //  NSPanel 86  //  style "verre sombre"
#  Pages : Accueil (horloge + météo)  >  Lumières  /  Climat
#          + Prévisions météo à 7 jours (ouverte depuis l'accueil)
# ============================================================
#  Prérequis (HACS > Frontend) :
#    - button-card (custom:button-card) v7.0+
#    - kiosk-mode (masque l'en-tête et le menu)
#
#  Climatisation / qualité de l'air : avec l'intégration, Configurer > Climatisation
#    (choix de l'entité Sensibo, qualité de l'air activable ou non).
#
#  Style : « verre » (défaut) ou « ardoise » (cartes sobres, titres en minuscules,
#    météo en fond conservée). Avec l'intégration Maison NSPanel : Configurer > Apparence.
#    Sans l'intégration, le style reste « verre ».
#
#  Rappel poubelles : variable "rappels" de la carte Accueil (jours, texte,
#    icône, couleur, plage horaire) — voir le bloc commenté dans la carte.
#
#  Retour auto à l'accueil : 15 s sans toucher l'écran (Lumières et Climat).
#    Pour changer la durée : modifier IDLE_SECONDS (2 endroits : en-têtes
#    des pages Lumières et Climat), puis recharger la page.
#
#  Navigation :
#    - Accueil : deux grandes tuiles en bas (Lumières, Climat) et la
#      petite température (appui = prévisions à 7 jours).
#    - Lumières / Climat : touchez l'en-tête (titre ou pastille ACCUEIL)
#      pour revenir à l'accueil.
#    - Prévisions : touchez l'en-tête (pastille FERMER) pour revenir.
#    Le dashboard détecte seul son adresse.
#
#  MÉTÉO — À FAIRE UNE FOIS :
#    1) Avec l'intégration « Maison NSPanel » : rien à modifier dans ce fichier.
#       L'entité météo (ex. Météo-France : weather.<votre_ville>) se choisit dans
#       Paramètres > Appareils et services > Maison NSPanel > Configurer > Météo,
#       et le dashboard la suit automatiquement.
#       Sans l'intégration : remplacez "weather.forecast_maison" (valeur par défaut)
#       par votre entité météo (chercher / remplacer dans tout le fichier).
#    2) Les prévisions à 7 jours sont fournies par l'intégration
#       (sensor.maison_nspanel_previsions). Sans elle, ajoutez
#       previsions_meteo_sensor.yaml à votre configuration.
#    3) Horloge : ajoutez l'intégration "Heure et date" (Paramètres >
#       Appareils et services > Ajouter une intégration) et cochez
#       "Heure" pour créer sensor.time, qui fait avancer l'horloge.
#    4) Fond d'écran météo : copiez les 18 images du fichier meteo_images.zip
#       dans /config/www/meteo/ (créer le dossier). Elles sont servies par
#       HA à l'adresse /local/meteo/<nom>.jpg. Sans les images, un décor
#       dessiné par le code s'affiche à la place. Pour utiliser vos propres
#       photos, gardez les mêmes noms de fichiers ou modifiez la variable
#       "images" de la carte de l'accueil.
#
#  Entités utilisées :
#    weather.forecast_maison, sun.sun, sensor.time (horloge), sensor.previsions_meteo_7_jours (ou, avec l'intégration Maison NSPanel,
#    sensor.maison_nspanel_previsions et sensor.maison_nspanel_rappels),
#    sensor.sejour_climatisation_co2 ou _tvoc (qualité de l'air, détecté seul),
#    switch.outlet_1, light.sejour_cuisine, light.sejour_mur_tv,
#    light.sejour_mur_sdb, light.jardin_jardin,
#    climate.sejour_climatisation,
#    switch.sejour_climatisation_climate_react,
#    binary_sensor.sejour_climatisation_nettoyage_du_filtre_requis
#
#  Utilisation : nouveau tableau de bord > menu ⋮ > Éditeur de
#  configuration brute > coller ce fichier.
#
#  Lumières : appui court = allumer / éteindre, appui long = fiche de
#  l'entité (luminosité, couleur).
# ============================================================

button_card_templates:

  # ==========================================================
  #  Modèle de la page Accueil
  # ==========================================================

  # Tuile de navigation : s'allume si une des entités listées (ids) est active
  tile_nav:
    show_icon: true
    show_name: true
    show_label: true
    size: 24px
    variables:
      rgb: "250,204,21"
      dest: lumieres
      ids: []
      min_h: 16vh
    tap_action:
      action: navigate
      navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/' + variables.dest; ]]]"
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-rows: 1fr min-content min-content
        - grid-template-columns: 1fr
        - row-gap: 3px
      card:
        - position: relative
        - overflow: hidden
        - height: 100%
        - min-height: "[[[ return variables.min_h ]]]"
        - padding: 8px 6px
        - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '14px' : '18px' ]]]"
        - background: "[[[ return 'linear-gradient(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '100deg' : '145deg') + ', rgba(' + variables.rgb + ',' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.00' : '.12') + ') 0%, rgba(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '5,12,22' : '16,23,40') + ',.72) 62%)' ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(255,255,255,.08)') ]]]"
        - box-shadow: none
        - transition: all .3s ease
      img_cell:
        - width: 42px
        - height: 42px
        - justify-self: center
        - align-self: center
        - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '10px' : '13px' ]]]"
        - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'transparent' : ('rgba(' + variables.rgb + ',.14)') ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(' + variables.rgb + ',.28)') ]]]"
        - transition: all .3s ease
      icon:
        - width: 24px
        - color: "[[[ return 'rgb(' + variables.rgb + ')' ]]]"
      name:
        - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
        - font-size: 12px
        - font-weight: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '700' : '800' ]]]"
        - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '0' : '1px' ]]]"
        - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : 'uppercase' ]]]"
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(255,255,255,.90)' : ('#E2E8F0') ]]]"
        - margin-top: 2px
      label:
        - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
        - font-size: 12px
        - font-weight: 600
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(255,255,255,.40)' : ('#94A3B8') ]]]"
        - padding-bottom: 2px
        - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'uppercase' : 'none' ]]]"
        - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px' : 'normal' ]]]"
    state:
      - operator: template
        value: "[[[ return variables.ids.some(i => states[i] && ['on','cool','heat','dry','fan_only','heat_cool','auto'].includes(states[i].state)); ]]]"
        styles:
          card:
            - background: "[[[ return 'linear-gradient(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '100deg' : '145deg') + ', rgba(' + variables.rgb + ',' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.16' : '.28') + ') 0%, rgba(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '5,12,22' : '16,23,40') + ',.78) 68%)' ]]]"
            - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(' + variables.rgb + ',.55)') ]]]"
          img_cell:
            - background: "[[[ return 'rgba(' + variables.rgb + ',.30)' ]]]"
            - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(' + variables.rgb + ',.55)') ]]]"
            - box-shadow: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('0 0 14px rgba(' + variables.rgb + ',.45)') ]]]"
          name:
            - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(255,255,255,.90)' : ('rgb(' + variables.rgb + ')') ]]]"
          label:
            - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(255,255,255,.40)' : ('#E2E8F0') ]]]"
            - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'uppercase' : 'none' ]]]"
            - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px' : 'normal' ]]]"

  # ==========================================================
  #  Modèles de la page Lumières
  # ==========================================================

  # ----------------------------------------------------------
  # Tuile lumière : carte en verre + pastille d'icône teintée
  # ----------------------------------------------------------
  tile_light:
    show_icon: true
    show_name: true
    show_label: true
    size: 24px
    variables:
      rgb: "250,204,21"      # couleur du bouton, au format R,G,B
      min_h: 18vh            # hauteur minimale
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    label: >
      [[[
        if (entity.state === 'unavailable') return 'Indisponible';
        if (entity.state !== 'on') return 'Éteinte';
        const b = entity.attributes.brightness;
        return (b !== undefined && b !== null) ? 'Allumée · ' + Math.round(b / 2.55) + ' %' : 'Allumée';
      ]]]
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-rows: 1fr min-content min-content
        - grid-template-columns: 1fr
        - row-gap: 3px
      card:
        - position: relative
        - overflow: hidden
        - height: 100%
        - min-height: "[[[ return variables.min_h ]]]"
        - padding: 8px 6px
        - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '14px' : '18px' ]]]"
        - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(159,207,227,.055)' : 'linear-gradient(145deg, rgba(' + variables.rgb + ',.10) 0%, rgba(16,23,40,.82) 62%)' ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px solid rgba(184,226,239,.07)' : '1px solid rgba(255,255,255,.08)' ]]]"
        - box-shadow: none
        - transition: all .3s ease
      img_cell:
        - width: 42px
        - height: 42px
        - justify-self: center
        - align-self: center
        - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '10px' : '13px' ]]]"
        - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'transparent' : ('rgba(' + variables.rgb + ',.14)') ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(' + variables.rgb + ',.28)') ]]]"
        - transition: all .3s ease
      icon:
        - width: 24px
        - color: "[[[ return 'rgb(' + variables.rgb + ')' ]]]"
      name:
        - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
        - font-size: 12px
        - font-weight: 800
        - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.2px' : '1px' ]]]"
        - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : 'uppercase' ]]]"
        - white-space: nowrap
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(209,232,243,.92)' : '#B4BED0' ]]]"
        - margin-top: 2px
        - transition: color .3s ease
      label:
        - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
        - font-size: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '10px' : '12px' ]]]"
        - font-weight: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '700' : '600' ]]]"
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(214,238,245,.5)' : '#8A96A8' ]]]"
        - padding-bottom: 2px
        - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'uppercase' : 'none' ]]]"
        - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.6px' : 'normal' ]]]"
    state:
      - operator: template
        value: "[[[ return entity.state === 'on' ]]]"
        styles:
          card:
            - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(' + variables.rgb + ',.13)' : 'linear-gradient(145deg, rgba(' + variables.rgb + ',.26) 0%, rgba(16,23,40,.86) 68%)' ]]]"
            - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px solid rgba(' + variables.rgb + ',.30)' : '1px solid rgba(' + variables.rgb + ',.50)' ]]]"
          img_cell:
            - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'transparent' : 'rgba(' + variables.rgb + ',.30)' ]]]"
            - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : '1px solid rgba(' + variables.rgb + ',.55)' ]]]"
            - box-shadow: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : '0 0 14px rgba(' + variables.rgb + ',.45)' ]]]"
          name:
            - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '#FFFFFF' : 'rgb(' + variables.rgb + ')' ]]]"
          label:
            - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgb(' + variables.rgb + ')' : '#C7D2E5' ]]]"

  # ----------------------------------------------------------
  # Titre de section : texte à gauche + fine ligne qui s'efface
  # ----------------------------------------------------------
  section_title:
    show_icon: false
    show_name: false
    show_label: false
    tap_action:
      action: none
    variables:
      text: SECTION
    custom_fields:
      sep: >
        [[[
          return `<div style="display:flex;align-items:center;gap:10px;width:100%">
            <span>${variables.text}</span>
            <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)"></span>
          </div>`;
        ]]]
    styles:
      grid:
        - grid-template-areas: '"sep"'
        - grid-template-columns: 1fr
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - min-height: 4.5vh
        - padding: 4px 6px
      custom_fields:
        sep:
          - width: 100%
          - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
          - font-size: 11px
          - font-weight: 800
          - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1.4px' : '3px' ]]]"
          - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(194,222,235,.55)' : '#6B7A99' ]]]"

  # ==========================================================
  #  Modèles de la page Climat
  # ==========================================================

  # ----------------------------------------------------------
  # Base : carte en verre + pastille d'icône teintée
  # ----------------------------------------------------------
  tile_base:
    show_icon: true
    show_name: true
    show_label: false
    size: 20px
    variables:
      kind: none             # mode | fan | fancycle | swing | poscycle | on | none
      value: ""
      rgb: "148,163,184"     # couleur de la carte, au format R,G,B
      min_h: 13.5vh          # hauteur minimale du bouton
    styles:
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-rows: 1fr min-content min-content
        - grid-template-columns: 1fr
        - row-gap: 2px
      card:
        - position: relative
        - overflow: hidden
        - height: 100%
        - min-height: "[[[ return variables.min_h ]]]"
        - padding: 6px 2px
        - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '14px' : '18px' ]]]"
        - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(159,207,227,.055)' : 'linear-gradient(145deg, rgba(' + variables.rgb + ',.10) 0%, rgba(16,23,40,.82) 62%)' ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px solid rgba(184,226,239,.07)' : '1px solid rgba(255,255,255,.08)' ]]]"
        - box-shadow: none
        - transition: all .3s ease
      img_cell:
        - width: 34px
        - height: 34px
        - justify-self: center
        - align-self: center
        - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '9px' : '11px' ]]]"
        - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'transparent' : ('rgba(' + variables.rgb + ',.14)') ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(' + variables.rgb + ',.28)') ]]]"
        - transition: all .3s ease
      icon:
        - width: 20px
        - color: "[[[ return 'rgb(' + variables.rgb + ')' ]]]"
      name:
        - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
        - font-size: 11px
        - font-weight: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '800' : '800' ]]]"
        - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.2px' : '1px' ]]]"
        - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : 'uppercase' ]]]"
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(209,232,243,.92)' : '#B4BED0' ]]]"
        - margin-top: 2px
        - transition: color .3s ease
      label:
        - font-family: "'Inter','Segoe UI',Roboto,sans-serif"
        - font-size: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '10px' : '12px' ]]]"
        - font-weight: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '700' : '600' ]]]"
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(214,238,245,.5)' : '#8A96A8' ]]]"
        - padding-bottom: 2px
        - text-transform: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'uppercase' : 'none' ]]]"
        - letter-spacing: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.6px' : 'normal' ]]]"
    state:
      - operator: template
        value: >
          [[[
            const k = variables.kind, v = variables.value;
            if (k === 'mode') return entity.state === v;
            const fan = String(entity.attributes.fan_mode || '').toLowerCase();
            const sw = String(entity.attributes.swing_mode || '').toLowerCase();
            if (k === 'fan') return fan === v;
            if (k === 'fancycle') return ['low', 'medium', 'high'].includes(fan);
            if (k === 'swing') return sw.startsWith('range');
            if (k === 'poscycle') return sw.startsWith('fixed');
            if (k === 'none') return false;
            return entity.state === 'on';
          ]]]
        styles:
          card:
            - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(' + variables.rgb + ',.13)' : 'linear-gradient(145deg, rgba(' + variables.rgb + ',.26) 0%, rgba(16,23,40,.86) 68%)' ]]]"
            - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px solid rgba(' + variables.rgb + ',.30)' : '1px solid rgba(' + variables.rgb + ',.50)' ]]]"
          img_cell:
            - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'transparent' : 'rgba(' + variables.rgb + ',.30)' ]]]"
            - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : '1px solid rgba(' + variables.rgb + ',.55)' ]]]"
            - box-shadow: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : '0 0 14px rgba(' + variables.rgb + ',.45)' ]]]"
          name:
            - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '#FFFFFF' : 'rgb(' + variables.rgb + ')' ]]]"
          label:
            - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgb(' + variables.rgb + ')' : '#8A96A8' ]]]"

  # ----------------------------------------------------------
  # Mode HVAC
  # ----------------------------------------------------------
  tile_mode:
    template: tile_base
    variables:
      kind: mode
    tap_action:
      action: perform-action
      perform_action: climate.set_hvac_mode
      target:
        entity_id: climate.sejour_climatisation
      data:
        hvac_mode: "[[[ return variables.value ]]]"

  # ----------------------------------------------------------
  # Vitesse de ventilation (bouton fixe, ex. Auto)
  # ----------------------------------------------------------
  tile_fan:
    template: tile_base
    show_label: true
    label: "[[[ return String(entity.attributes.fan_mode || '').toLowerCase() === 'auto' ? 'Actif' : 'Off' ]]]"
    variables:
      kind: fan
      rgb: "34,211,238"
      min_h: 16vh
    tap_action:
      action: perform-action
      perform_action: climate.set_fan_mode
      target:
        entity_id: climate.sejour_climatisation
      data:
        fan_mode: "[[[ return variables.value ]]]"

  # ----------------------------------------------------------
  # Vitesse défilante : Bas > Moyen > Fort > Bas ...
  # ----------------------------------------------------------
  tile_fan_cycle:
    template: tile_base
    name: Vitesse
    show_label: true
    variables:
      kind: fancycle
      rgb: "34,211,238"
      min_h: 16vh
    icon: >
      [[[
        const f = String(entity.attributes.fan_mode || '').toLowerCase();
        return { low: 'mdi:fan-speed-1', medium: 'mdi:fan-speed-2', high: 'mdi:fan-speed-3' }[f] || 'mdi:fan';
      ]]]
    label: >
      [[[
        const f = String(entity.attributes.fan_mode || '').toLowerCase();
        return { low: 'Bas', medium: 'Moyen', high: 'Fort' }[f] || '—';
      ]]]
    tap_action:
      action: perform-action
      perform_action: climate.set_fan_mode
      target:
        entity_id: climate.sejour_climatisation
      data:
        fan_mode: >
          [[[
            const order = ['low', 'medium', 'high'];
            const avail = (entity.attributes.fan_modes || []).map(m => String(m).toLowerCase());
            const list = order.filter(o => avail.length === 0 || avail.includes(o));
            const cur = String(entity.attributes.fan_mode || '').toLowerCase();
            const i = list.indexOf(cur);
            return list[(i + 1) % list.length];
          ]]]

  # ----------------------------------------------------------
  # Position défilante : Haut > Mi-haut > Milieu > Mi-bas > Bas > Haut ...
  # ----------------------------------------------------------
  tile_pos_cycle:
    template: tile_base
    name: Position
    show_label: true
    variables:
      kind: poscycle
      rgb: "45,212,191"
      min_h: 16vh
    icon: >
      [[[
        const m = String(entity.attributes.swing_mode || '').toLowerCase();
        return {
          fixedtop: 'mdi:arrow-up',
          fixedmiddletop: 'mdi:arrow-top-right',
          fixedmiddle: 'mdi:arrow-right',
          fixedmiddlebottom: 'mdi:arrow-bottom-right',
          fixedbottom: 'mdi:arrow-down'
        }[m] || 'mdi:arrow-expand-vertical';
      ]]]
    label: >
      [[[
        const m = String(entity.attributes.swing_mode || '').toLowerCase();
        return {
          fixedtop: 'Haut',
          fixedmiddletop: 'Mi-haut',
          fixedmiddle: 'Milieu',
          fixedmiddlebottom: 'Mi-bas',
          fixedbottom: 'Bas'
        }[m] || '—';
      ]]]
    tap_action:
      action: perform-action
      perform_action: climate.set_swing_mode
      target:
        entity_id: climate.sejour_climatisation
      data:
        swing_mode: >
          [[[
            const order = ['fixedtop', 'fixedmiddletop', 'fixedmiddle', 'fixedmiddlebottom', 'fixedbottom'];
            const modes = entity.attributes.swing_modes || [];
            const avail = modes.map(m => String(m).toLowerCase());
            const list = order.filter(o => avail.length === 0 || avail.includes(o));
            const cur = String(entity.attributes.swing_mode || '').toLowerCase();
            const i = list.indexOf(cur);
            const next = list[(i + 1) % list.length];
            return modes.find(m => String(m).toLowerCase() === next) || next;
          ]]]

  # ----------------------------------------------------------
  # Boutons - / + de consigne
  # ----------------------------------------------------------
  tile_step:
    template: tile_base
    show_name: false
    size: 30px
    variables:
      kind: none
      step: 1
      rgb: "148,163,184"
    styles:
      card:
        - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(' + ({cool:'56,189,248',heat:'251,146,60',dry:'250,204,21',fan_only:'74,222,128',auto:'236,72,153',heat_cool:'236,72,153'}[entity.state] || '159,207,227') + ',.10)' : 'linear-gradient(145deg, rgba(148,163,184,.10) 0%, rgba(16,23,40,.82) 62%)' ]]]"
        - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '1px solid rgba(' + ({cool:'56,189,248',heat:'251,146,60',dry:'250,204,21',fan_only:'74,222,128',auto:'236,72,153',heat_cool:'236,72,153'}[entity.state] || '184,226,239') + ',.17)' : '1px solid rgba(255,255,255,.08)' ]]]"
      img_cell:
        - width: 54px
        - height: 54px
        - background: transparent
        - border: none
        - box-shadow: none
      icon:
        - width: 30px
        - color: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgb(' + ({cool:'56,189,248',heat:'251,146,60',dry:'250,204,21',fan_only:'74,222,128',auto:'236,72,153',heat_cool:'236,72,153'}[entity.state] || '209,232,243') + ')' : '#E6ECF7' ]]]"
    tap_action:
      action: perform-action
      perform_action: climate.set_temperature
      target:
        entity_id: climate.sejour_climatisation
      data:
        temperature: >
          [[[
            const t = (entity.attributes.temperature ?? 22) + variables.step;
            const lo = entity.attributes.min_temp ?? 16;
            const hi = entity.attributes.max_temp ?? 30;
            return Math.min(hi, Math.max(lo, t));
          ]]]

# ============================================================
#  DASHBOARD
# ============================================================
title: Maison

# Masque la barre du haut et le menu latéral (nécessite kiosk-mode via HACS).
# Pour les réafficher temporairement, ajoutez ?disable_km à l'adresse du dashboard.
kiosk_mode:
  hide_header: true
  hide_sidebar: true

views:
  # ==========================================================
  #  PAGE 1 : ACCUEIL
  # ==========================================================
  - title: Accueil
    path: accueil
    type: panel
    background: "#070b14"
    cards:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_label: false
        triggers_update:
          - weather.forecast_maison
          - sensor.maison_nspanel_previsions
          - sun.sun
          - sensor.time
          - climate.sejour_climatisation
          - sensor.sejour_climatisation_co2
          - sensor.sejour_climatisation_tvoc
          - sensor.maison_nspanel_rappels
          - sensor.84_weather_alert
          - sensor.maison_nspanel_vigilance
        variables:
          # ------------------------------------------------------------
          #  RAPPELS (notification sous l'heure) — FACILE À MODIFIER
          #    jours : jours d'affichage, 0=dim 1=lun 2=mar 3=mer 4=jeu 5=ven 6=sam
          #            ex. [1] = lundi seulement, [1, 4] = lundi et jeudi
          #    de / a : plage horaire (heures, optionnel) ex. de: 18, a: 24
          #    icone  : n'importe quelle icône mdi (ex. mdi:trash-can-outline)
          #    texte  : message affiché
          #    couleur: "R,V,B" (défaut : ambre "250,204,21", comme l'alerte filtre)
          #  Pour ajouter un rappel, copiez un bloc "- jours: ..." ci-dessous.
          #  Pour tester aujourd'hui, mettez le numéro du jour du jour.
          # ------------------------------------------------------------
          rappels:
            - jours: [1]
              de: 0
              a: 24
              icone: mdi:trash-can-outline
              texte: Sortir les poubelles
              couleur: "250,204,21"
          # Images de fond : fournies par l'intégration Maison NSPanel (/maison_nspanel/meteo/).
          # Sans l'intégration, copiez les images dans /config/www/meteo/ (dossier par défaut),
          # ou changez le dossier ici. Si un fichier manque, le décor dessiné par le code prend le relais.
          # images_dossier: /local/meteo
          # Pour remplacer une image précise (clé = condition, ex. rainy ou rainy-night) :
          # images:
          #   sunny: /local/mes_photos/soleil.jpg
          images: {}
          # Vigilance Météo-France. Avec l'intégration Maison NSPanel, le réglage se fait dans
          # Configurer > Vigilance (les 2 lignes ci-dessous ne servent alors plus). Sinon : capteur du département (ex. Vaucluse = sensor.84_weather_alert).
          # Détecté automatiquement si ce nom est inexact.
          # vigilance_min : 2 = à partir de jaune (défaut), 3 = orange et rouge seulement, 1 = toujours (même vert).
          vigilance: sensor.84_weather_alert
          vigilance_min: 2
        tap_action:
          action: none
        custom_fields:
          clock: >
            [[[
              const tz = hass.config.time_zone, d = new Date();
              const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: tz });
              const w = d.toLocaleDateString('fr-FR', { weekday: 'short', timeZone: tz });
              const m = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', timeZone: tz });
              const date = (w.charAt(0).toUpperCase() + w.slice(1)) + ' ' + m;
              // Rappels du jour (voir variables.rappels)
              const now = new Date(new Date().toLocaleString('en-US', { timeZone: tz }));
              const dow = now.getDay(), hr = now.getHours();
              // Si l'intégration « Maison NSPanel » est installée, les rappels viennent de son capteur
              // (modifiables dans l'interface). Sinon : variables.rappels ci-dessus.
              const rs = states['sensor.maison_nspanel_rappels'];
              const actifs = (rs && rs.attributes && Array.isArray(rs.attributes.rappels))
                ? rs.attributes.rappels
                : (variables.rappels || []).filter(r => {
                    const jours = Array.isArray(r.jours) ? r.jours : [r.jours];
                    const de = (r.de !== undefined) ? r.de : 0, a = (r.a !== undefined) ? r.a : 24;
                    return jours.indexOf(dow) !== -1 && hr >= de && hr < a;
                  });
              // Vigilance Météo-France (capteur « <département> Weather alert », détecté seul)
              const vigS = (variables.vigilance && states[variables.vigilance]) || Object.keys(states).filter(k => /^sensor\.(\d{2}|2a|2b)_weather_alert$/.test(k)).map(k => states[k])[0];
              const vigLv = { vert: 1, jaune: 2, orange: 3, rouge: 4 };
              const vigRgb = { 1: '74,222,128', 2: '250,204,21', 3: '251,146,60', 4: '239,68,68' };
              // Si l'intégration est installée, son capteur de vigilance (réglé dans Configurer > Vigilance) prime
              const vi = states['sensor.maison_nspanel_vigilance'];
              const viOk = !!(vi && vi.attributes && vi.attributes.niveau !== undefined);
              let vigHtml = '';
              if (vigS || viOk) {
                const lv = viOk ? vi.attributes.niveau : (vigLv[String(vigS.state || '').toLowerCase()] || 1);
                const mini = (variables.vigilance_min !== undefined) ? variables.vigilance_min : 2;
                if (viOk ? vi.attributes.afficher : lv >= mini) {
                  const c = viOk ? vi.attributes.couleur : vigRgb[lv];
                  const nom = ['', 'vert', 'jaune', 'orange', 'rouge'][lv].toUpperCase();
                  const ph = viOk ? (vi.attributes.phenomenes || []).map(x => x.nom).join(' · ') : Object.keys(vigS.attributes || {}).filter(k => vigLv[String(vigS.attributes[k]).toLowerCase()] >= 2)
                    .sort((a, b) => vigLv[String(vigS.attributes[b]).toLowerCase()] - vigLv[String(vigS.attributes[a]).toLowerCase()])
                    .map(k => k.replace(/-/g, ' / ')).join(' · ');
                  vigHtml = '<div style="max-width:100%"><div style="display:inline-flex;align-items:center;gap:10px;padding:6px 13px 6px 6px;border-radius:18px;background:linear-gradient(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '100deg' : '145deg') + ', rgba(' + c + ',' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.00' : '.16') + ') 0%, rgba(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '5,12,22' : '16,23,40') + ',.82) 60%);border:1px solid rgba(' + c + ',.60);max-width:100%;box-sizing:border-box;text-align:left">'
                    + '<span style="display:flex;flex:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:12px;background:rgba(' + c + ',.20);border:1px solid rgba(' + c + ',.45);box-shadow:0 0 14px rgba(' + c + ',.40)">'
                    + '<ha-icon icon="mdi:weather-cloudy-alert" style="--mdc-icon-size:20px;color:rgb(' + c + ')"></ha-icon></span>'
                    + '<span style="display:flex;flex-direction:column;min-width:0"><span style="font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgb(' + c + ')">Vigilance ' + nom + '</span>'
                    + (ph ? '<span style="font-size:11px;font-weight:600;color:#E2E8F0;margin-top:1px">' + ph + '</span>' : '') + '</span></div></div>';
                }
              }
              const pills = actifs.map(r => {
                const c = r.couleur || '250,204,21';
                // Même style que l'alerte « FILTRE À NETTOYER » : bordure ambre, puce teintée, texte en capitales espacées
                return '<div style="max-width:100%"><div style="display:inline-flex;align-items:center;gap:10px;padding:6px 13px 6px 6px;border-radius:18px;background:linear-gradient(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '100deg' : '145deg') + ', rgba(' + c + ',' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '.06' : '.14') + ') 0%, rgba(' + ((states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '5,12,22' : '16,23,40') + ',.82) 60%);border:1px solid rgba(' + c + ',.55)">'
                  + '<span style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:12px;background:rgba(' + c + ',.20);border:1px solid rgba(' + c + ',.45);box-shadow:0 0 14px rgba(' + c + ',.40)">'
                  + '<ha-icon icon="' + (r.icone || 'mdi:bell-outline') + '" style="--mdc-icon-size:20px;color:rgb(' + c + ')"></ha-icon></span>'
                  + '<span style="font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgb(' + c + ')">' + (r.texte || '') + '</span></div></div>';
              }).join('');
              return '<div style="text-align:center">'
                + '<div style="font-size:21vh;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;color:#FFFFFF;text-shadow:0 2px 24px rgba(0,0,0,.65)">' + time + '</div>'
                + '<div style="margin-top:1.2vh;font-size:19px;font-weight:600;letter-spacing:.5px;color:#E2E8F0;text-shadow:0 1px 10px rgba(0,0,0,.7)">' + date + '</div>'
                + ((pills || vigHtml) ? '<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:1.4vh">' + pills + vigHtml + '</div>' : '')
                + '</div>';
            ]]]
          weather:
            card:
              type: custom:button-card
              triggers_update:
                - weather.forecast_maison
                - sensor.maison_nspanel_previsions
                - sun.sun
              show_icon: true
              show_name: true
              show_label: true
              size: 26px
              label: EXTÉRIEUR
              icon: >
                [[[
                  const m = { 'clear-night': 'mdi:weather-night', cloudy: 'mdi:weather-cloudy', exceptional: 'mdi:alert-circle-outline', fog: 'mdi:weather-fog', hail: 'mdi:weather-hail', lightning: 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy', partlycloudy: 'mdi:weather-partly-cloudy', pouring: 'mdi:weather-pouring', rainy: 'mdi:weather-rainy', snowy: 'mdi:weather-snowy', 'snowy-rainy': 'mdi:weather-snowy-rainy', sunny: 'mdi:weather-sunny', windy: 'mdi:weather-windy', 'windy-variant': 'mdi:weather-windy-variant' };
                  const w = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')];
                  const s = (() => { const w0 = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')]; const sn = states['sun.sun']; let x = w0 ? w0.state : 'unknown'; if (sn && sn.state === 'above_horizon' && x === 'clear-night') x = 'sunny'; if (sn && sn.state === 'below_horizon' && x === 'sunny') x = 'clear-night'; return x; })();
                  return (w && m[s]) || 'mdi:weather-cloudy';
                ]]]
              name: >
                [[[
                  const w = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')];
                  const t = w ? w.attributes.temperature : undefined;
                  return (t !== undefined && t !== null) ? (Math.round(Number(t) * 10) / 10) + ' °C' : '-- °C';
                ]]]
              tap_action:
                action: navigate
                navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/previsions'; ]]]"
              styles:
                grid:
                  - grid-template-areas: '"i l" "i n"'
                  - grid-template-columns: min-content 1fr
                  - grid-template-rows: min-content min-content
                  - column-gap: 10px
                  - row-gap: 1px
                  - align-content: center
                  - align-items: center
                card:
                  - padding: 8px 12px
                  - min-height: 9vh
                  - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '14px' : '18px' ]]]"
                  - background: >
                      [[[
                        if (!(states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise')) return 'rgba(16,23,40,.62)';
                        const w = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')];
                        const st = w ? w.state : '';
                        const tint = ({ sunny: '251,191,36', partlycloudy: '251,191,36', rainy: '96,165,250', pouring: '96,165,250', lightning: '96,165,250', 'lightning-rainy': '96,165,250', snowy: '186,230,253' })[st] || '148,163,184';
                        return 'linear-gradient(90deg, rgba(' + tint + ',.16) 0%, rgba(6,12,22,.97) 27%, rgba(6,12,22,.96) 100%)';
                      ]]]
                  - border: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'none' : ('1px solid rgba(255,255,255,.12)') ]]]"
                  - box-shadow: none
                img_cell:
                  - width: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '30px' : '28px' ]]]"
                  - height: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '30px' : '28px' ]]]"
                  - border-radius: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? '50%' : '0' ]]]"
                  - background: "[[[ return (states['sensor.maison_nspanel_rappels'] && states['sensor.maison_nspanel_rappels'].attributes.style === 'ardoise') ? 'rgba(255,255,255,.04)' : 'transparent' ]]]"
                  - justify-self: center
                icon:
                  - width: 26px
                  - color: >
                      [[[
                        const c = { sunny: '#FBBF24', 'clear-night': '#E2E8F0', partlycloudy: '#FCD34D', cloudy: '#CBD5E1', fog: '#CBD5E1', windy: '#CBD5E1', 'windy-variant': '#CBD5E1', rainy: '#7DD3FC', pouring: '#60A5FA', snowy: '#E0F2FE', 'snowy-rainy': '#BAE6FD', hail: '#BAE6FD', lightning: '#FACC15', 'lightning-rainy': '#FACC15', exceptional: '#FB923C' };
                        const w = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')];
                        const s = (() => { const w0 = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')]; const sn = states['sun.sun']; let x = w0 ? w0.state : 'unknown'; if (sn && sn.state === 'above_horizon' && x === 'clear-night') x = 'sunny'; if (sn && sn.state === 'below_horizon' && x === 'sunny') x = 'clear-night'; return x; })();
                        return (w && c[s]) || '#E2E8F0';
                      ]]]
