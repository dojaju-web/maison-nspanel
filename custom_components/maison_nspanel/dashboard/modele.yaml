                    lightning: [shade, flash, clouds, grey],
                    'lightning-rainy': [shade, flash, rain, clouds, grey],
                    windy: [shade, wind, clouds, grey],
                    'windy-variant': [shade, wind, clouds, grey]
                  };
                  return photo + (layers[c] || [shade, sky]).join(', ');
                ]]]
