  # ==========================================================
  #  PRÉVISIONS MÉTÉO À 7 JOURS (ouverte depuis l'accueil)
  # ==========================================================
  - title: Prévisions
    path: previsions
    subview: true
    type: panel
    background: "radial-gradient(120% 80% at 85% 0%, #15233f 0%, #0b1120 55%, #070b14 100%) fixed"
    cards:
