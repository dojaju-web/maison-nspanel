          - type: custom:button-card
            show_icon: true
            show_name: true
            show_label: true
            name: Prévision à 7 jours
            size: 22px
            triggers_update:
              - weather.forecast_maison
              - sensor.maison_nspanel_previsions
              - sun.sun
            icon: >
              [[[
                const w = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')];
                const s = (() => { const w0 = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')]; const sn = states['sun.sun']; let x = w0 ? w0.state : 'unknown'; if (sn && sn.state === 'above_horizon' && x === 'clear-night') x = 'sunny'; if (sn && sn.state === 'below_horizon' && x === 'sunny') x = 'clear-night'; return x; })();
                const m = { 'clear-night': 'mdi:weather-night', cloudy: 'mdi:weather-cloudy', exceptional: 'mdi:alert-circle-outline', fog: 'mdi:weather-fog', hail: 'mdi:weather-hail', lightning: 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy', partlycloudy: 'mdi:weather-partly-cloudy', pouring: 'mdi:weather-pouring', rainy: 'mdi:weather-rainy', snowy: 'mdi:weather-snowy', 'snowy-rainy': 'mdi:weather-snowy-rainy', sunny: 'mdi:weather-sunny', windy: 'mdi:weather-windy', 'windy-variant': 'mdi:weather-windy-variant' };
                return (w && m[s]) || 'mdi:weather-cloudy';
              ]]]
            label: >
              [[[
                const w = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')];
                const s = (() => { const w0 = states[((states['sensor.maison_nspanel_previsions'] && states['sensor.maison_nspanel_previsions'].attributes.weather_entity) || 'weather.forecast_maison')]; const sn = states['sun.sun']; let x = w0 ? w0.state : 'unknown'; if (sn && sn.state === 'above_horizon' && x === 'clear-night') x = 'sunny'; if (sn && sn.state === 'below_horizon' && x === 'sunny') x = 'clear-night'; return x; })();
                if (!w) return 'MÉTÉO INDISPONIBLE';
                const l = { 'clear-night': 'Nuit dégagée', cloudy: 'Nuageux', exceptional: 'Exceptionnel', fog: 'Brouillard', hail: 'Grêle', lightning: 'Orageux', 'lightning-rainy': 'Orage et pluie', partlycloudy: 'Partiellement nuageux', pouring: 'Averses', rainy: 'Pluvieux', snowy: 'Neigeux', 'snowy-rainy': 'Neige et pluie', sunny: 'Ensoleillé', windy: 'Venteux', 'windy-variant': 'Venteux' };
                const t = w.attributes.temperature;
                return (l[s] || s).toUpperCase() + ((t !== undefined && t !== null) ? ' · ' + Number(t).toFixed(1) + ' °C' : '');
              ]]]
            tap_action:
              action: navigate
              # Si la navigation ne marche pas, remplacez la ligne suivante par :
