              .av-radar {position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(var(--c),.14);background:conic-gradient(from 90deg, transparent 0deg,rgba(var(--c),.16) 45deg,transparent 115deg);opacity:.4}
              .av-moving .av-radar {opacity:1;animation:avSpin 5s linear infinite}
              .av-robot {width:100px;height:100px;position:relative;filter:drop-shadow(0 12px 12px rgba(0,0,0,.50))}
              .av-robot svg {width:100%;height:100%;display:block}
              .av-metrics {display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:7px;z-index:2}
              .av-metric {display:flex;flex-direction:column;gap:4px;min-width:0;padding:8px 9px 7px;border-radius:11px;background:rgba(159,207,227,.055);box-shadow:inset 0 0 0 1px rgba(184,226,239,.055)}
              .av-metric-label {font-size:8px;font-weight:800;letter-spacing:.55px;color:rgba(214,238,245,.5);white-space:nowrap}
